<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Right Triangle Explorer — Ch. 9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f2ec;--paper:#fff;--sand:#e8e4db;--ink:#1a1714;--rule:#ccc8be;
  --blue:#1650a8;--blue-lt:#deeafa;--blue-bg:#eef3fc;
  --green:#1a6e42;--green-lt:#d5eed9;--green-bg:#eaf5ec;
  --red:#b83020;--red-lt:#f5d0cb;--red-bg:#fdf0ee;
  --gold:#b87010;
  --display:'Archivo Black',Impact,sans-serif;
  --mono:'DM Mono',monospace;--body:'DM Sans',sans-serif;
}
html{background:var(--bg)}
body{font-family:var(--body);background:var(--bg);color:var(--ink);min-height:100vh;
  -webkit-font-smoothing:antialiased;padding:0}

/* HERO */
.hero{padding:20px 28px 16px;border-bottom:2.5px solid var(--ink);
  display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px}
.hero-tag{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink);opacity:.4;margin-bottom:5px}
.hero-title{font-family:var(--display);font-size:clamp(24px,6vw,52px);line-height:.92;color:var(--ink)}
.hero-sub{font-size:14px;color:var(--ink);opacity:.55;max-width:340px;line-height:1.55;align-self:flex-end}

/* MODE TABS */
.mode-bar{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:2px solid var(--ink)}
.mode-btn{padding:11px 0;border:none;background:transparent;
  font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink);opacity:.35;cursor:pointer;
  border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;text-align:center;line-height:1.3}
.mode-btn.active{opacity:1;border-bottom-color:var(--ink)}

/* INPUTS STRIP */
.inputs-strip{padding:18px 28px;background:var(--paper);border-bottom:1px solid var(--rule);
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:500px){.inputs-strip{grid-template-columns:1fr;gap:8px}}
.inp-block{display:flex;flex-direction:column;gap:5px}
.inp-lbl{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase}
.inp-lbl.blue{color:var(--blue)}
.inp-lbl.green{color:var(--green)}
.inp-lbl.red{color:var(--red)}
.inp-num{font-family:var(--display);font-size:clamp(28px,5vw,44px);line-height:1;
  padding:8px 12px;border:2px solid var(--rule);background:var(--bg);
  color:var(--ink);outline:none;width:100%;text-align:center;
  -moz-appearance:textfield;transition:border .15s}
.inp-num:focus{border-color:var(--ink)}
.inp-num::-webkit-inner-spin-button,.inp-num::-webkit-outer-spin-button{-webkit-appearance:none}
.inp-num[readonly]{background:var(--sand);color:var(--ink);opacity:.7;cursor:default;border-style:dashed}
.inp-num.computed{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.inp-sub{font-family:var(--mono);font-size:10px;color:var(--ink);opacity:.4;
  text-align:center;text-transform:uppercase;letter-spacing:.06em}

/* CANVAS SECTION */
.canvas-section{padding:0;background:var(--sand);border-bottom:1px solid var(--rule)}
canvas{display:block;width:100%}

/* EQUATION BAND */
.eq-band{padding:16px 28px;background:var(--ink);
  font-family:var(--display);font-size:clamp(18px,4vw,32px);
  letter-spacing:.04em;color:var(--bg);text-align:center;
  border-bottom:1px solid var(--rule)}
.eq-band .eq-a{color:#7aa8e8}
.eq-band .eq-b{color:#6ec891}
.eq-band .eq-c{color:#e87a6a}
.eq-band .eq-op{color:rgba(255,255,255,.4);margin:0 8px}

/* WORKING */
.working-section{padding:18px 28px;border-bottom:1px solid var(--rule)}
.wk-head{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink);opacity:.4;margin-bottom:10px}
.wk-steps{display:flex;flex-direction:column;gap:4px}
.wk-line{font-family:var(--mono);font-size:13px;color:var(--ink);line-height:1.6}
.wk-line.result{font-family:var(--display);font-size:20px;color:var(--ink)}
.wk-line .hl-blue{color:var(--blue);font-weight:600}
.wk-line .hl-green{color:var(--green);font-weight:600}
.wk-line .hl-red{color:var(--red);font-weight:600}

/* TRIPLE BAND */
.triple-band{padding:16px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.triple-badge{font-family:var(--display);font-size:20px;letter-spacing:.04em;
  padding:8px 16px;border:2.5px solid currentColor;white-space:nowrap}
.triple-badge.yes{color:var(--green)}
.triple-badge.no{color:var(--rule)}
.triple-badge.almost{color:var(--gold)}
.triple-detail{font-family:var(--mono);font-size:12px;line-height:1.65;color:var(--ink);opacity:.6}

/* KNOWN TRIPLES STRIP */
.triples-strip{padding:14px 28px;border-top:1px solid var(--rule);background:var(--paper);
  display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ts-label{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink);opacity:.4;margin-right:4px}
.ts-btn{padding:5px 12px;border:1.5px solid var(--rule);background:transparent;
  font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink);opacity:.6;
  cursor:pointer;transition:all .12s}
.ts-btn:hover{border-color:var(--ink);opacity:1}
.ts-btn.active{background:var(--ink);color:var(--bg);border-color:var(--ink);opacity:1}
</style>
</head>
<body>

<div class="hero">
  <div>
    <div class="hero-tag">Ch. 9 · Baudhāyana–Pythagoras Theorem</div>
    <div class="hero-title">Right Triangle<br>Explorer</div>
  </div>
  <div class="hero-sub">Enter any two sides. The squares on every side are drawn to scale — their areas are the proof.</div>
</div>

<div class="mode-bar">
  <button class="mode-btn active" data-m="0">Find c<br>(hypotenuse)</button>
  <button class="mode-btn" data-m="1">Find b<br>(given a, c)</button>
  <button class="mode-btn" data-m="2">Find a<br>(given b, c)</button>
</div>

<div class="inputs-strip">
  <div class="inp-block">
    <div class="inp-lbl blue">Side a</div>
    <input class="inp-num" type="number" id="inp-a" value="3" min="0.1" step="0.5">
    <div class="inp-sub">shorter leg</div>
  </div>
  <div class="inp-block">
    <div class="inp-lbl green">Side b</div>
    <input class="inp-num" type="number" id="inp-b" value="4" min="0.1" step="0.5">
    <div class="inp-sub">shorter leg</div>
  </div>
  <div class="inp-block">
    <div class="inp-lbl red">Hypotenuse c</div>
    <input class="inp-num computed" type="number" id="inp-c" placeholder="—" readonly>
    <div class="inp-sub">longest side</div>
  </div>
</div>

<div class="canvas-section">
  <canvas id="cvs"></canvas>
</div>

<div class="eq-band" id="eq-band"></div>

<div class="working-section">
  <div class="wk-head">Step-by-step working</div>
  <div class="wk-steps" id="working"></div>
</div>

<div class="triple-band" id="triple-band"></div>

<div class="triples-strip">
  <span class="ts-label">Known triples</span>
  <button class="ts-btn active" data-a="3" data-b="4" data-c="5">3, 4, 5</button>
  <button class="ts-btn" data-a="5" data-b="12" data-c="13">5, 12, 13</button>
  <button class="ts-btn" data-a="8" data-b="15" data-c="17">8, 15, 17</button>
  <button class="ts-btn" data-a="7" data-b="24" data-c="25">7, 24, 25</button>
  <button class="ts-btn" data-a="6" data-b="8" data-c="10">6, 8, 10</button>
  <button class="ts-btn" data-a="9" data-b="12" data-c="15">9, 12, 15</button>
  <button class="ts-btn" data-a="5" data-b="7" data-c="">5, 7, ?</button>
</div>

<script>
let mode=0;
const BLUE='#1650a8',GREEN='#1a6e42',RED='#b83020';
const BLUE_LT='rgba(22,80,168,.16)',GREEN_LT='rgba(26,110,66,.16)',RED_LT='rgba(184,48,32,.16)';

function getVals(){
  return {
    a:parseFloat(document.getElementById('inp-a').value)||0,
    b:parseFloat(document.getElementById('inp-b').value)||0,
    c:parseFloat(document.getElementById('inp-c').value)||0
  };
}

function fmt(n){
  if(!n||isNaN(n)) return '—';
  return n===Math.round(n)?n.toString():(Math.round(n*1000)/1000).toString();
}

function compute(){
  let {a,b,c}=getVals();
  const cEl=document.getElementById('inp-c');
  const bEl=document.getElementById('inp-b');
  const aEl=document.getElementById('inp-a');

  if(mode===0&&a>0&&b>0){
    c=Math.sqrt(a*a+b*b);
    cEl.value=parseFloat(c.toFixed(4));
  } else if(mode===1&&a>0&&c>a){
    b=Math.sqrt(c*c-a*a);
    bEl.value=parseFloat(b.toFixed(4));
  } else if(mode===2&&b>0&&c>b){
    a=Math.sqrt(c*c-b*b);
    aEl.value=parseFloat(a.toFixed(4));
  }

  const v=getVals();
  if(mode===0) v.c=c;
  if(mode===1) v.b=b;
  if(mode===2) v.a=a;

  drawAll(v.a,v.b,v.c);
  updateEq(v.a,v.b,v.c);
  updateWorking(v.a,v.b,v.c);
  updateTriple(v.a,v.b,v.c);
}

function drawAll(a,b,c){
  const cvs=document.getElementById('cvs');
  const PR=Math.min(window.devicePixelRatio||1,2);
  const W=cvs.parentElement.clientWidth;

  // Height: enough for triangle + squares on all sides
  // The diagram needs room for: square on b (left), triangle (centre), square on a (below), hyp square (top-right)
  // Rough height: b + c is the tallest span
  const H=Math.round(Math.min(W*0.65,480));
  cvs.width=W*PR; cvs.height=H*PR;
  cvs.style.width=W+'px'; cvs.style.height=H+'px';
  const ctx=cvs.getContext('2d');
  ctx.scale(PR,PR);
  ctx.fillStyle='#e8e4db'; ctx.fillRect(0,0,W,H);

  if(!a||!b||!c||isNaN(c)||c<=0) return;

  // Scale: we need to fit b-square (width b) to left, a-square (height a) below,
  // hyp square on hypotenuse. Total bounding box roughly (b+c) wide, (b+c) tall.
  const PAD=32;
  const scale=Math.min(
    (W-PAD*2)/(b+c+4),
    (H-PAD*2)/(b+c+4)
  );

  const sa=a*scale, sb=b*scale, sc=c*scale;

  // Right angle at O. Triangle: O bottom-left, A bottom-right (side a), B top-left (side b)
  // Place O so b-square fits to the left and a-square fits below
  const ox=PAD+sb+8, oy=H-PAD-sa-8;
  const O={x:ox,y:oy};
  const A={x:ox+sa,y:oy};    // right along x
  const Bv={x:ox,y:oy-sb};   // up along y

  // ── Square on a (blue) — below OA ──
  const aP=[O,A,{x:A.x,y:A.y+sa},{x:O.x,y:O.y+sa}];
  fillPoly(ctx,aP,BLUE_LT,BLUE,2);
  // Area label inside
  labelSquare(ctx,(ox+ox+sa)/2,oy+sa/2,`a² = ${fmt(a*a)}`,BLUE,scale*a*0.22);

  // ── Square on b (green) — left of OB ──
  const bP=[O,Bv,{x:Bv.x-sb,y:Bv.y},{x:O.x-sb,y:O.y}];
  fillPoly(ctx,bP,GREEN_LT,GREEN,2);
  labelSquare(ctx,ox-sb/2,oy-sb/2,`b² = ${fmt(b*b)}`,GREEN,scale*b*0.18);

  // ── Square on hypotenuse (red) — on the outer side of AB ──
  const dx=Bv.x-A.x, dy=Bv.y-A.y;
  // Perpendicular pointing outward (away from O): rotate dx,dy by -90°
  const px2=dy, py2=-dx;  // outward normal (to the right of A→B)
  const C2={x:A.x+px2,y:A.y+py2};
  const D2={x:Bv.x+px2,y:Bv.y+py2};
  const cP=[A,Bv,D2,C2];
  fillPoly(ctx,cP,RED_LT,RED,2);
  const cmx=(A.x+Bv.x+C2.x+D2.x)/4, cmy=(A.y+Bv.y+C2.y+D2.y)/4;
  labelSquare(ctx,cmx,cmy,`c² = ${fmt(c*c)}`,RED,scale*c*0.14);

  // ── Triangle fill ──
  fillPoly(ctx,[O,A,Bv],'rgba(255,255,255,.55)','#1a1714',2.5);

  // Right angle mark at O
  const rm=Math.min(14,sa*0.18,sb*0.18);
  ctx.beginPath();ctx.strokeStyle='#1a1714';ctx.lineWidth=1.5;
  ctx.moveTo(ox+rm,oy);ctx.lineTo(ox+rm,oy-rm);ctx.lineTo(ox,oy-rm);ctx.stroke();

  // ── Side dimension labels ──
  ctx.font=`600 ${clamp(11,15,scale*a*0.18)}px DM Mono`;
  ctx.textAlign='center';ctx.fillStyle=BLUE;
  ctx.fillText(`a = ${fmt(a)}`,ox+sa/2,oy+16);

  ctx.font=`600 ${clamp(11,15,scale*b*0.18)}px DM Mono`;
  ctx.save();ctx.translate(ox-16,oy-sb/2);ctx.rotate(-Math.PI/2);
  ctx.fillStyle=GREEN;ctx.fillText(`b = ${fmt(b)}`,0,0);ctx.restore();

  // c label along hypotenuse midpoint, offset outward
  const hm={x:(A.x+Bv.x)/2,y:(A.y+Bv.y)/2};
  const perpLen=Math.hypot(px2,py2);
  const outOff=18;
  ctx.font=`600 ${clamp(11,15,scale*c*0.12)}px DM Mono`;
  ctx.fillStyle=RED;ctx.textAlign='center';
  ctx.fillText(`c = ${fmt(c)}`,hm.x+px2/perpLen*outOff,hm.y+py2/perpLen*outOff);
}

function fillPoly(ctx,pts,fill,stroke,lw){
  ctx.beginPath();
  pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();
  ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();
}

function labelSquare(ctx,cx,cy,text,color,size){
  const fs=clamp(10,20,size);
  ctx.font=`bold ${fs}px Archivo Black,DM Mono,monospace`;
  ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text,cx,cy);
  ctx.textBaseline='alphabetic';
}

function clamp(lo,hi,v){return Math.max(lo,Math.min(hi,v));}

function updateEq(a,b,c){
  const el=document.getElementById('eq-band');
  if(!a||!b||!c||isNaN(c)){el.textContent='a² + b² = c²';return;}
  el.innerHTML=`<span class="eq-a">${fmt(a*a)}</span><span class="eq-op">+</span><span class="eq-b">${fmt(b*b)}</span><span class="eq-op">=</span><span class="eq-c">${fmt(c*c)}</span>`;
}

function updateWorking(a,b,c){
  const el=document.getElementById('working');
  if(!a||!b||!c||isNaN(c)){el.innerHTML='<div class="wk-line">Enter two sides above.</div>';return;}
  let html='';
  if(mode===0){
    html=`<div class="wk-line">a² + b² = c²</div>
      <div class="wk-line"><span class="hl-blue">${fmt(a)}</span>² + <span class="hl-green">${fmt(b)}</span>² = c²</div>
      <div class="wk-line"><span class="hl-blue">${fmt(a*a)}</span> + <span class="hl-green">${fmt(b*b)}</span> = c²</div>
      <div class="wk-line">c² = ${fmt(a*a+b*b)}</div>
      <div class="wk-line result">c = √${fmt(a*a+b*b)} = <span class="hl-red">${fmt(c)}</span></div>`;
  } else if(mode===1){
    html=`<div class="wk-line">a² + b² = c²  →  b² = c² − a²</div>
      <div class="wk-line">b² = <span class="hl-red">${fmt(c)}</span>² − <span class="hl-blue">${fmt(a)}</span>² = ${fmt(c*c)} − ${fmt(a*a)}</div>
      <div class="wk-line">b² = ${fmt(c*c-a*a)}</div>
      <div class="wk-line result">b = √${fmt(c*c-a*a)} = <span class="hl-green">${fmt(b)}</span></div>`;
  } else {
    html=`<div class="wk-line">a² + b² = c²  →  a² = c² − b²</div>
      <div class="wk-line">a² = <span class="hl-red">${fmt(c)}</span>² − <span class="hl-green">${fmt(b)}</span>² = ${fmt(c*c)} − ${fmt(b*b)}</div>
      <div class="wk-line">a² = ${fmt(c*c-b*b)}</div>
      <div class="wk-line result">a = √${fmt(c*c-b*b)} = <span class="hl-blue">${fmt(a)}</span></div>`;
  }
  el.innerHTML=html;
}

function gcd(a,b){return b===0?a:gcd(b,a%b);}

function updateTriple(a,b,c){
  const el=document.getElementById('triple-band');
  if(!a||!b||!c||isNaN(c)){el.innerHTML='';return;}
  const ai=Math.round(a),bi=Math.round(b),ci=Math.round(c);
  const isInt=Math.abs(a-ai)<0.002&&Math.abs(b-bi)<0.002&&Math.abs(c-ci)<0.002;
  if(isInt&&ai*ai+bi*bi===ci*ci){
    const g=gcd(gcd(ai,bi),ci);
    const prim=g===1;
    el.innerHTML=`<div class="triple-badge yes">✓ Pythagorean triple</div>
      <div class="triple-detail">(${ai}, ${bi}, ${ci}) — all integers, a²+b²=c². ${prim?'This is a <strong>primitive</strong> triple — the three numbers share no common factor.':`Divide by ${g} → primitive triple (${ai/g}, ${bi/g}, ${ci/g}).`}</div>`;
  } else if(isInt){
    el.innerHTML=`<div class="triple-badge no">Not a triple</div>
      <div class="triple-detail">(${ai}, ${bi}, ${ci}) — all integers, but ${ai}²+${bi}² = ${ai*ai+bi*bi}, not ${ci*ci}.</div>`;
  } else {
    el.innerHTML=`<div class="triple-badge almost" style="color:var(--rule)">Not a triple</div>
      <div class="triple-detail">Sides are not all whole numbers. Pythagorean triples require all three sides to be integers.</div>`;
  }

  // Highlight matching known triple button
  document.querySelectorAll('.ts-btn').forEach(btn=>{
    const ta=+btn.dataset.a,tb=+btn.dataset.b,tc=+btn.dataset.c||0;
    const match=(Math.abs(a-ta)<0.01&&Math.abs(b-tb)<0.01)||(Math.abs(a-tb)<0.01&&Math.abs(b-ta)<0.01);
    btn.classList.toggle('active',match);
  });
}

// Mode switch
document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    mode=+btn.dataset.m;
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');

    const aEl=document.getElementById('inp-a');
    const bEl=document.getElementById('inp-b');
    const cEl=document.getElementById('inp-c');

    // Reset readOnly and computed styling
    [aEl,bEl,cEl].forEach(el=>{el.readOnly=false;el.classList.remove('computed');});

    if(mode===0){cEl.readOnly=true;cEl.classList.add('computed');aEl.value=3;bEl.value=4;cEl.value='';}
    else if(mode===1){bEl.readOnly=true;bEl.classList.add('computed');aEl.value=8;bEl.value='';cEl.value=17;}
    else{aEl.readOnly=true;aEl.classList.add('computed');aEl.value='';bEl.value=12;cEl.value=13;}
    compute();
  });
});

// Known triples
document.querySelectorAll('.ts-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const a=+btn.dataset.a,b=+btn.dataset.b;
    document.getElementById('inp-a').value=a;
    document.getElementById('inp-b').value=b;
    if(mode!==0){
      document.querySelectorAll('.mode-btn')[0].click();
      setTimeout(()=>{
        document.getElementById('inp-a').value=a;
        document.getElementById('inp-b').value=b;
        compute();
      },10);
    } else compute();
  });
});

['inp-a','inp-b','inp-c'].forEach(id=>document.getElementById(id).addEventListener('input',compute));
window.addEventListener('resize',compute);
compute();
</script>
</body>
</html>
